<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DEV-CLAN</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loginScreen" class="screen active">
    <div class="panel">
      <h1>DEV-CLAN</h1>
      <p>Login or Register</p>

      <input id="username" type="text" value="player1" placeholder="Username" />
      <input id="password" type="password" value="123456" placeholder="Password" />

      <div class="buttons">
        <button id="loginBtn">Login</button>
        <button id="registerBtn" class="secondary">Register</button>
      </div>

      <p id="status" class="status"></p>
    </div>
  </div>

  <div id="gameScreen" class="screen">
    <div class="hud">
      <span id="playerName">Player</span>
      <button id="logoutBtn">Logout</button>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </div>

  <script src="app.js"></script>
</body>
</html>
